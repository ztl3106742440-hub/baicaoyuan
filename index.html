<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef0df">
  <meta name="description" content="百草园：考研英语一写作与难词学习应用。">
  <title>百草园</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/app-icon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f2e8;color:#30362e;font:15px/1.75 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}.launch{width:min(520px,100%);padding:30px;border:1px solid #d2d9c8;border-radius:20px;background:#fffdf8;text-align:center;box-shadow:0 18px 50px #424c370f}.launch-mark{display:grid;width:64px;height:64px;place-items:center;margin:auto;border-radius:50%;background:#667f67;color:white;font:700 27px Georgia,serif}.launch h1{margin:18px 0 7px;font:600 30px/1.25 Georgia,"Songti SC",serif}.launch p{margin:0 0 20px;color:#6d7568}.launch a{display:inline-grid;min-height:48px;place-items:center;padding:8px 20px;border-radius:99px;background:#30362e;color:#fff;text-decoration:none;font-weight:700}
  </style>
  <script>location.replace("./writing/part-b/");</script>
</head>
<body>
  <main class="launch"><span class="launch-mark">草</span><h1>百草园</h1><p>默认进入写作模块。若页面没有自动跳转，请使用下方入口。</p><a href="./writing/part-b/">进入写作</a></main>
